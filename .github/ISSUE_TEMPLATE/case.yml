name: 分享案例
description: 分享素材、模型、制作经验、Prompt 或 Skill
title: "[Case] "
body:
  - type: textarea
    id: result
    attributes:
      label: 目标与效果
      description: 想实现什么，效果如何，有哪些已知问题。可直接拖入截图或录屏。
      placeholder: 例：立绘拆层后自动生成，加了眨眼和摇头；头发物理正常，袖子摆动穿模。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 版本与步骤
      description: PSD2Live 版本与主要步骤；使用 AI 时注明客户端、模型、Prompt 或 Skill。
    validations:
      required: true
  - type: textarea
    id: assets
    attributes:
      label: 素材与来源
      description: 25 MB 以内直接拖入，更大的文件提供免登录下载链接。注明作者与来源。
  - type: textarea
    id: license
    attributes:
      label: 单独许可（可选）
      description: 不填则按 CC0 1.0 发布。
  - type: checkboxes
    id: terms
    attributes:
      label: 确认
      options:
        - label: 我有权分享这些内容，并同意未注明许可的内容按 CC0 1.0 发布；内容中不含令牌或私人信息。
          required: true
