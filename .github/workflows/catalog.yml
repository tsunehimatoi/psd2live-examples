name: Validate examples catalog
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog and binary policy
        run: python scripts/validate.py
      - name: Test download integrity
        run: python -m unittest discover -s scripts -p 'test_*.py'
